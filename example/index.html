<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kit B6 - Demonstração integrada ODS</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-width: 320px;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #root-app {
      width: 100%;
      height: 100%;
    }

    .example-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .example-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
    }

    .example-tab {
      padding: 10px 14px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #1e1e1e;
      color: #ccc;
      font: inherit;
      cursor: pointer;
    }

    .example-tab:hover {
      background: #2a2a2a;
      color: #fff;
    }

    .example-tab[aria-selected="true"] {
      border-color: #2196f3;
      background: #0d47a1;
      color: #fff;
    }

    [hidden] {
      display: none !important;
    }

    .example-intro h1,
    .example-section h2 {
      margin: 0;
    }

    .example-intro p,
    .example-section-description {
      color: #aaa;
      line-height: 1.5;
    }

    .example-intro p {
      margin: 8px 0 0;
    }

    .example-section {
      min-width: 0;
      padding: 18px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #1e1e1e;
    }

    .example-section h2 {
      margin-bottom: 8px;
      font-size: 19px;
    }

    .example-section-description {
      margin: 0 0 16px;
      font-size: 14px;
    }

    #zone-editor-canvas {
      position: relative;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 9;
      margin-bottom: 12px;
      overflow: hidden;
      border: 2px solid #555;
      border-radius: 4px;
      background-color: #000;
      background-image: url('https://picsum.photos/id/122/800/450');
      background-size: cover;
      background-position: center;
      user-select: none;
    }

    .zone-controls,
    .alert-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .example-action {
      padding: 9px 12px;
      border: 0;
      border-radius: 4px;
      background: #333;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.2s;
    }

    .example-action:hover {
      filter: brightness(1.2);
    }

    #btn-start {
      background: #1976d2;
    }

    #btn-stop {
      background: #f57c00;
    }

    #btn-export {
      background: #388e3c;
    }

    #btn-clear {
      background: #d32f2f;
    }

    #video-mock {
      display: flex;
      min-height: 64px;
      margin-bottom: 14px;
      padding: 12px;
      align-items: center;
      justify-content: center;
      border: 2px solid #555;
      border-radius: 4px;
      background: #000;
      color: #aaa;
      font-family: monospace;
      text-align: center;
    }

    .zone-guide {
      margin: 0;
      padding-left: 20px;
      color: #ccc;
      font-size: 13px;
      line-height: 1.7;
    }

    .ods-player-container .ods-btn {
      min-width: 35px;
      padding: 5px;
      border: 0;
      border-radius: 0;
      background: none;
      color: #fff;
      font-size: 16px;
    }

    .ods-player-container .ods-btn:hover {
      background: none;
      color: #2196f3;
    }

    .ods-alert-console .ods-btn {
      border: 1px solid #444;
      border-radius: 4px;
      background: #333;
      color: #fff;
      font-size: 12px;
    }

    .ods-alert-console .ods-btn-focus {
      border-color: #0d47a1;
      background: #0d47a1;
    }

    .ods-alert-console .ods-btn-bulk {
      border-color: #1b5e20;
      background: #2e7d32;
    }

    .ods-alert-console .ods-btn:hover {
      background: #444;
    }

    .ods-alert-console .ods-btn-focus:hover {
      background: #1565c0;
    }

    .ods-alert-console .ods-btn-ack:hover {
      border-color: #2e7d32;
      background: #2e7d32;
    }

    .ods-alert-console .ods-btn-close:hover {
      border-color: #d32f2f;
      background: #d32f2f;
    }

    .ods-alert-console .ods-btn-bulk:hover {
      background: #1b5e20;
    }

    @media (max-width: 900px) {
      .ods-sidebar {
        width: 190px;
        flex: 0 0 190px;
      }
    }

    @media (max-width: 640px) {
      .ods-sidebar {
        width: 64px;
        flex: 0 0 64px;
      }

      .ods-nav-item {
        justify-content: center;
        padding: 12px 6px;
        font-size: 0;
      }

      .ods-nav-item span {
        display: none;
      }

      .ods-status-panel {
        padding: 8px 4px;
        font-size: 10px;
      }

      .ods-status-row {
        flex-direction: column;
        gap: 2px;
      }

      .ods-main-content {
        padding: 12px;
      }

      .example-section {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="root-app"></div>

  <script type="module">
    import { AppShell } from '../b6-app-shell/b6_app_shell.ts';
    import { ZoneEditor } from '../b6-zone-editor/b6_zone_editor.ts';
    import { AlertConsole } from '../b6-alert-console/b6_alert_console.ts';
    import { OverlayPlayer } from '../b6-overlay-player/b6_overlay_player.ts';

    const shell = new AppShell({
      containerId: 'root-app',
      appName: 'Kit B6 · Inspeção Industrial ODS',
      initialTheme: 'DARK',
      onThemeToggle: theme => console.log('Tema alterado para:', theme),
      onNavClick: selectTab
    });

    shell.setNavItems([
      { id: 'dashboard', label: 'Visão geral', icon: '📊', isActive: true },
      { id: 'cameras', label: 'Player de vídeo (B6.1)', icon: '📹' },
      { id: 'zones', label: 'Editor de zonas (B6.2)', icon: '✏️' },
      { id: 'alerts', label: 'Console de alertas (B6.3)', icon: '🚨' }
    ]);

    const mainContent = shell.getMainContainer();
    mainContent.innerHTML = `
      <div class="example-content">
        <div class="example-tabs" role="tablist" aria-label="Componentes B6">
          <button class="example-tab" id="tab-dashboard" type="button" role="tab" aria-selected="true" aria-controls="dashboard" data-tab-target="dashboard">Visão geral</button>
          <button class="example-tab" id="tab-cameras" type="button" role="tab" aria-selected="false" aria-controls="cameras" tabindex="-1" data-tab-target="cameras">Player · B6.1</button>
          <button class="example-tab" id="tab-zones" type="button" role="tab" aria-selected="false" aria-controls="zones" tabindex="-1" data-tab-target="zones">Editor de zonas · B6.2</button>
          <button class="example-tab" id="tab-alerts" type="button" role="tab" aria-selected="false" aria-controls="alerts" tabindex="-1" data-tab-target="alerts">Alertas · B6.3</button>
        </div>

        <section class="example-section" id="dashboard" role="tabpanel" aria-labelledby="tab-dashboard">
          <h1>Demonstração integrada</h1>
          <p class="example-section-description">Selecione uma aba para abrir o Player de vídeo (B6.1), o Editor de zonas (B6.2) ou o Console de alertas (B6.3). A navegação, o tema e o estado da Jetson são geridos pela AppShell (B6.4).</p>
        </section>

        <section class="example-section" id="cameras" role="tabpanel" aria-labelledby="tab-cameras" hidden>
          <h2>Player com overlay · B6.1</h2>
          <p class="example-section-description">Reprodução de vídeo com caixas de deteção sincronizadas com a timeline.</p>
          <div id="ods-stream-container"></div>
        </section>

        <section class="example-section" id="zones" role="tabpanel" aria-labelledby="tab-zones" hidden>
          <h2>Editor de zonas · B6.2</h2>
          <p class="example-section-description">Desenhe e edite polígonos sobre a imagem de referência.</p>
          <div id="zone-editor-canvas"></div>
          <div class="zone-controls">
            <button class="example-action" id="btn-start" type="button">Iniciar desenho</button>
            <button class="example-action" id="btn-stop" type="button">Parar desenho</button>
            <button class="example-action" id="btn-export" type="button">Exportar zonas</button>
            <button class="example-action" id="btn-clear" type="button">Limpar zonas</button>
          </div>
          <ul class="zone-guide">
            <li>Desenhar: clique esquerdo para adicionar pontos; clique direito para fechar a zona.</li>
            <li>Editar: arraste os pontos ou o interior da zona; arraste uma aresta para adicionar um ponto.</li>
            <li>Apagar: clique direito sobre um ponto ou dentro da zona.</li>
          </ul>
        </section>

        <section class="example-section" id="alerts" role="tabpanel" aria-labelledby="tab-alerts" hidden>
          <h2>Console de alertas · B6.3</h2>
          <p class="example-section-description">Filtre, reconheça, silencie ou encerre alertas de demonstração.</p>
          <div class="alert-controls">
            <button class="example-action" id="btn-trigger-crit" type="button">🚨 Simular crítico</button>
            <button class="example-action" id="btn-trigger-warn" type="button">⚠️ Simular aviso</button>
          </div>
          <div id="video-mock">Foco do vídeo: aguarda seleção de um alerta.</div>
          <div id="alert-wrapper"></div>
        </section>
      </div>
    `;

    function selectTab(sectionId) {
      const selectedPanel = document.getElementById(sectionId);
      if (!selectedPanel) return;

      document.querySelectorAll('[data-tab-target]').forEach(tab => {
        const isSelected = tab.dataset.tabTarget === sectionId;
        tab.setAttribute('aria-selected', String(isSelected));
        tab.tabIndex = isSelected ? 0 : -1;
      });

      document.querySelectorAll('[role="tabpanel"]').forEach(panel => {
        panel.hidden = panel.id !== sectionId;
      });

      window.dispatchEvent(new Event('resize'));
    }

    document.querySelectorAll('[data-tab-target]').forEach(tab => {
      tab.addEventListener('click', () => selectTab(tab.dataset.tabTarget));
      tab.addEventListener('keydown', event => {
        const tabs = Array.from(document.querySelectorAll('[data-tab-target]'));
        const currentIndex = tabs.indexOf(tab);
        let nextIndex = currentIndex;

        if (event.key === 'ArrowRight') nextIndex = (currentIndex + 1) % tabs.length;
        else if (event.key === 'ArrowLeft') nextIndex = (currentIndex - 1 + tabs.length) % tabs.length;
        else if (event.key === 'Home') nextIndex = 0;
        else if (event.key === 'End') nextIndex = tabs.length - 1;
        else return;

        event.preventDefault();
        tabs[nextIndex].focus();
        selectTab(tabs[nextIndex].dataset.tabTarget);
      });
    });

    const player = new OverlayPlayer({
      containerId: 'ods-stream-container',
      videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4',
      autoPlay: false
    });

    player.loadMetadataTimeline([
      {
        startTime: 1,
        endTime: 4.5,
        boxes: [
          { id: '1', label: 'Coelho detetado (ID: A1)', color: '#00FF00', x: 0.1, y: 0.2, width: 0.3, height: 0.6 }
        ]
      },
      {
        startTime: 5,
        endTime: 8,
        boxes: [
          { id: '2', label: 'Alerta de zona proibida', color: '#FF0000', x: 0.6, y: 0.1, width: 0.2, height: 0.2 }
        ]
      }
    ]);

    const zoneEditor = new ZoneEditor('zone-editor-canvas');
    document.getElementById('btn-start').addEventListener('click', () => zoneEditor.startDrawingMode());
    document.getElementById('btn-stop').addEventListener('click', () => zoneEditor.stopDrawingMode());
    document.getElementById('btn-export').addEventListener('click', () => {
      const zones = zoneEditor.exportAllZones('Setor_Risco', 'DANGER');
      console.log('Zonas exportadas:', JSON.stringify(zones, null, 2));
      window.alert(`Exportadas ${zones.length} zonas. Consulte a consola (F12).`);
    });
    document.getElementById('btn-clear').addEventListener('click', () => zoneEditor.clearAll());

    const videoMock = document.getElementById('video-mock');
    const alertConsole = new AlertConsole({
      containerId: 'alert-wrapper',
      onAcknowledge: id => alertConsole.updateAlertStatus(id, 'ACKNOWLEDGED'),
      onMute: id => alertConsole.updateAlertStatus(id, 'MUTED'),
      onClose: id => {
        alertConsole.updateAlertStatus(id, 'CLOSED');
        alertConsole.removeAlert(id);
      },
      onFocusTimeline: (id, timestamp) => {
        const time = new Date(timestamp).toLocaleTimeString('pt-PT');
        videoMock.textContent = `Alerta ${id}: foco no vídeo às ${time}`;
        videoMock.style.borderColor = '#4CAF50';
        window.setTimeout(() => {
          videoMock.style.borderColor = '#555';
        }, 1000);
      },
      onAcknowledgeAll: () => alertConsole.acknowledgeAllActiveLocally()
    });

    alertConsole.loadAlerts([
      { id: '1', severity: 'WARNING', message: 'Indivíduo na zona B.', timestamp: Date.now() - 120000, status: 'ACTIVE' },
      { id: '2', severity: 'CRITICAL', message: 'Intrusão confirmada.', timestamp: Date.now() - 60000, status: 'ACKNOWLEDGED' }
    ]);

    let alertCounter = 3;
    document.getElementById('btn-trigger-crit').addEventListener('click', () => {
      alertConsole.addAlert({
        id: `c_${alertCounter++}`,
        severity: 'CRITICAL',
        message: 'Invasão perimetral!',
        timestamp: Date.now(),
        status: 'ACTIVE'
      });
    });
    document.getElementById('btn-trigger-warn').addEventListener('click', () => {
      alertConsole.addAlert({
        id: `w_${alertCounter++}`,
        severity: 'WARNING',
        message: 'Movimento suspeito.',
        timestamp: Date.now(),
        status: 'ACTIVE'
      });
    });

    const updateHardwareStatus = () => {
      shell.updateJetsonStatus({
        isOnline: true,
        cpuLoad: Math.floor(Math.random() * 40) + 10,
        gpuLoad: Math.floor(Math.random() * 80) + 20,
        ramUsage: 65,
        temperature: Math.floor(Math.random() * 15) + 45
      });
    };
    updateHardwareStatus();
    window.setInterval(updateHardwareStatus, 2000);
  </script>
</body>
</html>
