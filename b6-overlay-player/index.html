<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="UTF-8">
  <title>Teste Overlay Player B6.1</title>
  <style>
    body {
      background-color: #222;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
      margin: 0;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h2>Sincronização de Overlay (Quadro Correto)</h2>
    <p style="color: #aaa; font-size: 14px;">As marcações acompanham os segundos exatos do clipe reproduzido.</p>
  </div>

  <div id="ods-stream-container"></div>

  <script type="module">
    import { OverlayPlayer } from './b6_overlay_player.ts';

    // Inicializa o Player
    const player = new OverlayPlayer({
      containerId: 'ods-stream-container',
      videoUrl: 'https://www.w3schools.com/html/mov_bbb.mp4',
      autoPlay: false
    });

    // Injeta metadados falsos baseados no tempo (Timeline ODS DTO)
    // Coordenadas normalizadas [0.0 a 1.0]
    player.loadMetadataTimeline([
      {
        startTime: 1.0, // A caixa aparece no segundo 1.0
        endTime: 4.5,   // E mantém-se visível de forma fluida até ao segundo 4.5
        boxes: [
          { id: '1', label: 'Coelho Detetado (ID: A1)', color: '#00FF00', x: 0.1, y: 0.2, width: 0.3, height: 0.6 }
        ]
      },
      {
        startTime: 5.0, // Aparece no segundo 5.0
        endTime: 8.0,   // Fica no ecrã até ao segundo 8.0
        boxes: [
          { id: '2', label: 'Alerta de Zona Proibida', color: '#FF0000', x: 0.6, y: 0.1, width: 0.2, height: 0.2 }
        ]
      }
    ]);

  </script>
</body>

</html>
